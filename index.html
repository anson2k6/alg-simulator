<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MST Simulator: Kruskal and Prim</title>
<style>
:root{--bg:#0a0f1f;--pan:#111936;--ln:#232f5e;--tx:#e6ebff;--mu:#8b97c4;--tree:#22d3ee;--cur:#fbbf24;--rej:#fb7185;--cand:#a78bfa}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--tx);font:16px/1.5 "Segoe UI",system-ui,-apple-system,sans-serif;background:radial-gradient(1200px 600px at 20% -10%,#1a2760 0,var(--bg) 60%)}
.wrap{max-width:1180px;margin:0 auto;padding:22px}
header{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;margin-bottom:16px}
h1{margin:0;font-size:1.45rem;font-weight:700;letter-spacing:-.01em}
h1 small{display:block;font-size:.9rem;font-weight:400;color:var(--mu);letter-spacing:0}
.seg{display:flex;background:var(--pan);border:1px solid var(--ln);border-radius:999px;padding:4px}
.seg button{font:inherit;font-weight:600;color:var(--mu);background:none;border:0;padding:8px 22px;border-radius:999px;cursor:pointer;transition:.25s}
.seg button.on{background:var(--tree);color:#04222a}
button:focus-visible,input:focus-visible{outline:3px solid var(--cand);outline-offset:2px}
.grid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(250px,1fr);gap:16px}
@media(max-width:860px){.grid{grid-template-columns:1fr}}
.stage{position:relative;border:1px solid var(--ln);border-radius:16px;overflow:hidden;background:#0c1228;box-shadow:0 20px 60px #0008;
 background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);background-size:32px 32px}
svg{display:block;width:100%;height:auto}
.hud{position:absolute;top:12px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
.badge{font-size:.82rem;color:var(--mu);background:#0a0f1fcc;border:1px solid var(--ln);padding:5px 12px;border-radius:999px}
.badge b{color:var(--tx)}
.cost{text-align:right;background:#0a0f1fcc;border:1px solid var(--ln);border-radius:12px;padding:4px 14px}
.cost span{display:block;font-size:.72rem;color:var(--mu)}
.cost strong{font-size:1.7rem;line-height:1.1;font-variant-numeric:tabular-nums}
.cost strong.pop{animation:pop .5s}
.cap{position:absolute;left:14px;right:14px;bottom:62px;text-align:center}
.cap p{display:inline-block;max-width:90%;margin:0;padding:8px 16px;border-radius:10px;background:#050816e6;border:1px solid var(--ln);backdrop-filter:blur(6px);animation:fade .35s}
.bar{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:10px;padding:10px 14px;background:linear-gradient(transparent,#050816f0 40%)}
.bar button{font:inherit;color:var(--tx);background:#ffffff14;border:0;border-radius:50%;width:38px;height:38px;cursor:pointer;transition:.2s}
.bar button:hover:not(:disabled){background:#ffffff2e}
.bar button:disabled{opacity:.3;cursor:default}
.bar #play{width:44px;height:44px;background:var(--tree);color:#04222a}
.bar #play:hover{background:#67e8f9!important}
#scr{flex:1;-webkit-appearance:none;appearance:none;height:6px;border-radius:3px;cursor:pointer;background:linear-gradient(90deg,var(--tree) var(--p,0%),#ffffff2a var(--p,0%))}
#scr::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#fff}
#scr::-moz-range-thumb{width:16px;height:16px;border:0;border-radius:50%;background:#fff}
.bar select{font:inherit;color:var(--tx);background:#ffffff14;border:0;border-radius:8px;padding:6px 8px}
.bar select option{color:#000}
.t{font-size:.82rem;color:var(--mu);min-width:68px;text-align:center;font-variant-numeric:tabular-nums}
.side{background:var(--pan);border:1px solid var(--ln);border-radius:16px;padding:16px}
.side h2{font-size:.95rem;margin:0 0 8px;color:var(--mu);font-weight:600}
.side h2:not(:first-child){margin-top:18px}
ul{list-style:none;margin:0;padding:0}
li{display:flex;justify-content:space-between;padding:6px 10px;margin-bottom:3px;border-radius:8px;border:1px solid transparent;transition:.3s}
li.pend{color:var(--mu)}
li.acc{background:#22d3ee1f;border-color:var(--tree)}
li.rej{background:#fb718518;border-color:#fb718566;color:var(--mu);text-decoration:line-through}
li.cur{background:#fbbf2426;border-color:var(--cur);font-weight:700}
li.cand{background:#a78bfa1f;border-color:var(--cand)}
.chip{display:inline-block;margin:0 6px 6px 0;padding:3px 12px;border-radius:999px;border:2px solid;font-weight:700;transition:.3s}
.note{margin:18px 0 0;font-size:.82rem;color:var(--mu)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
/* svg */
.e{stroke:#33427a;stroke-width:2.5;stroke-linecap:round;transition:stroke .4s,stroke-width .4s,opacity .4s}
.e.cand{stroke:var(--cand);stroke-width:3.5}
.e.cur{stroke:var(--cur);stroke-width:6;filter:url(#glow)}
.e.tree{stroke:var(--tree);stroke-width:7;stroke-dasharray:1;filter:url(#glow);animation:grow .7s ease-out}
.e.rej{stroke:var(--rej);stroke-width:2.5;stroke-dasharray:.035 .03;opacity:.5}
.w rect{fill:#0a0f1f;stroke:#33427a;transition:stroke .4s}
.w text{fill:var(--tx);font-size:14px;font-weight:700;text-anchor:middle}
.w.on rect{stroke:var(--cur)}
.v circle{stroke-width:3;transition:fill .5s,stroke .4s}
.v text{font-size:19px;font-weight:800;text-anchor:middle;transition:fill .5s}
@keyframes grow{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes pop{50%{transform:scale(1.25);color:var(--tree)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
<header>
<h1>Minimum spanning tree simulator<small>Watch Kruskal's and Prim's algorithms build the cheapest network on the same graph.</small></h1>
<div class="seg" role="group" aria-label="Algorithm"><button id="bk" class="on">Kruskal</button><button id="bp">Prim</button></div>
</header>
<div class="grid">
<div>
<div class="stage">
<svg id="g" viewBox="0 0 640 400" role="img" aria-label="Weighted graph being simulated"></svg>
<div class="hud"><div class="badge" id="badge"></div><div class="cost"><span>Total cost</span><strong id="cost">0</strong></div></div>
<div class="cap"><p id="cap"></p></div>
<div class="bar">
<button id="back" aria-label="Previous step">&#9664;</button>
<button id="play" aria-label="Play">&#9654;</button>
<button id="next" aria-label="Next step">&#9654;&#9654;</button>
<input id="scr" type="range" min="0" max="1" value="0" aria-label="Timeline">
<span class="t" id="stp"></span>
<select id="spd" aria-label="Speed"><option value="0">0.5x</option><option value="1">0.75x</option><option value="2" selected>1x</option><option value="3">1.5x</option><option value="4">2x</option></select>
</div>
</div>
</div>
<aside class="side"><div id="side"></div>
<p class="note"><span class="dot" style="background:var(--tree)"></span>In the tree <span class="dot" style="background:var(--rej)"></span>Rejected <span class="dot" style="background:var(--cur)"></span>Examining <span class="dot" style="background:var(--cand)"></span>Prim's choices<br>Space plays or pauses. Arrow keys step.</p></aside>
</div>
</div>
<script>
const V=['A','B','C','D','E','F','G'];
const P=[[90,105],[300,60],[530,105],[150,255],[420,245],[255,350],[560,335]];
const E=[[0,1,7],[0,3,5],[1,2,8],[1,3,9],[1,4,7],[2,4,5],[3,4,15],[3,5,6],[4,5,8],[4,6,9],[5,6,11]];
const PAL=['#22d3ee','#fbbf24','#a78bfa','#34d399','#fb7185','#60a5fa','#f472b6'];
const nm=i=>V[E[i][0]]+'-'+V[E[i][1]],$=id=>document.getElementById(id);

function kruskal(){
  const order=E.map((_,i)=>i).sort((a,b)=>E[a][2]-E[b][2]||a-b);
  const par=V.map((_,i)=>i),f=x=>par[x]===x?x:(par[x]=f(par[x]));
  const roots=()=>V.map((_,i)=>f(i));
  let tree=[],rej=[],cost=0;
  const S=[{msg:'Sort all edges by weight. Every vertex starts in its own set.',tree,rej,cur:null,cost,order,roots:roots()}];
  S[0].ex=S[0].msg;
  order.forEach(i=>{
    const[u,v,w]=E[i],a=f(u),b=f(v),ok=a!==b;
    if(ok){par[a]=b;tree=[...tree,i];cost+=w}else rej=[...rej,i];
    S.push({ex:`Examine ${nm(i)} (weight ${w}): are ${V[u]} and ${V[v]} already connected?`,
      msg:ok?`Different sets, so accept ${nm(i)} and merge them.`:`Same set. Adding ${nm(i)} would make a cycle, so reject it.`,
      tree,rej,cur:i,cost,order,roots:roots()});
  });
  S[S.length-1].msg+=` Done: ${tree.length} edges, total cost ${cost}.`;
  return S;
}
function prim(){
  const vis=new Set([0]);let tree=[],cost=0;
  const cand=()=>E.map((_,i)=>i).filter(i=>vis.has(E[i][0])!==vis.has(E[i][1])).sort((a,b)=>E[a][2]-E[b][2]);
  const S=[{msg:'Start from vertex A and grow the tree one edge at a time.',tree,cur:null,cost,vis:[0],cand:cand()}];
  S[0].ex=S[0].msg;
  while(vis.size<V.length){
    const c=cand(),i=c[0],[u,v,w]=E[i],nv=vis.has(u)?v:u;
    vis.add(nv);tree=[...tree,i];cost+=w;
    S.push({ex:`Look at every edge leaving the tree. The cheapest is ${nm(i)} (weight ${w}).`,
      msg:`Add edge ${nm(i)} and pull in vertex ${V[nv]}.`,tree,cur:i,cost,vis:[...vis],cand:c});
  }
  S[S.length-1].msg+=` Done: all vertices connected, total cost ${cost}.`;
  return S;
}

/* build the scene once so CSS transitions can animate between steps */
$('g').innerHTML='<defs><filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>'
 +E.map(([u,v],i)=>`<line id="e${i}" class="e" pathLength="1" x1="${P[u][0]}" y1="${P[u][1]}" x2="${P[v][0]}" y2="${P[v][1]}"/>`).join('')
 +E.map(([u,v,w],i)=>{const x=(P[u][0]+P[v][0])/2,y=(P[u][1]+P[v][1])/2;return `<g id="w${i}" class="w"><rect x="${x-16}" y="${y-12}" width="32" height="24" rx="12"/><text x="${x}" y="${y+5}">${w}</text></g>`}).join('')
 +V.map((n,i)=>`<g id="v${i}" class="v"><circle cx="${P[i][0]}" cy="${P[i][1]}" r="23"/><text x="${P[i][0]}" y="${P[i][1]+7}">${n}</text></g>`).join('')
 +'<circle id="dot" r="8" fill="#fbbf24" opacity="0" filter="url(#glow)"/>';

let mode='k',steps=kruskal(),idx=0,ph='d',playing=false,tm=null,tk=0,shown=0;

function apply(){
  const s=steps[idx],x=ph==='x'&&s.cur!=null,b=x?steps[idx-1]:s,k=mode==='k';
  const tree=new Set(b.tree),rej=new Set(b.rej||[]),cand=new Set(x&&!k?s.cand:[]);
  E.forEach((e,i)=>{
    let c='e';
    if(x&&i===s.cur)c+=' cur';else if(tree.has(i))c+=' tree';else if(rej.has(i))c+=' rej';else if(cand.has(i))c+=' cand';
    $('e'+i).setAttribute('class',c);
    $('w'+i).setAttribute('class','w'+(x&&i===s.cur?' on':''));
  });
  V.forEach((n,i)=>{
    let fill='#1a2345',tc='#e6ebff',st='#3b4a85';
    if(k){fill=PAL[b.roots[i]];tc='#0a0f1f';st=fill}
    else if(b.vis.includes(i)){fill=PAL[0];tc='#0a0f1f';st=fill}
    if(x&&E[s.cur].slice(0,2).includes(i))st='#fbbf24';
    const g=$('v'+i);g.firstChild.style.fill=fill;g.firstChild.style.stroke=st;g.lastChild.style.fill=tc;
  });
  /* captions, cost, scrubber */
  const cap=$('cap');cap.textContent=x?s.ex:s.msg;cap.style.animation='none';void cap.offsetWidth;cap.style.animation='';
  const cs=$('cost');if(+cs.textContent!==b.cost){cs.textContent=b.cost;cs.classList.remove('pop');void cs.offsetWidth;cs.classList.add('pop')}
  $('stp').textContent=`Step ${idx} / ${steps.length-1}`;
  const sc=$('scr');sc.max=steps.length-1;sc.value=idx;sc.style.setProperty('--p',(idx/(steps.length-1)*100)+'%');
  $('back').disabled=idx===0&&!x;$('next').disabled=idx===steps.length-1;
  $('badge').innerHTML=k?'<b>Kruskal</b> &middot; sort edges, avoid cycles &middot; O(E log E)':'<b>Prim</b> &middot; grow from a start vertex &middot; O(E log V)';
  /* side panel */
  let h='';
  if(k){
    h+='<h2>Edges, cheapest first</h2><ul>';
    s.order.forEach(i=>{const c=x&&i===s.cur?'cur':tree.has(i)?'acc':rej.has(i)?'rej':'pend';h+=`<li class="${c}"><span>${nm(i)}</span><span>${E[i][2]}</span></li>`});
    h+='</ul><h2>Connected sets</h2>';
    const grp={};b.roots.forEach((r,i)=>(grp[r]=grp[r]||[]).push(V[i]));
    Object.entries(grp).forEach(([r,g])=>h+=`<span class="chip" style="border-color:${PAL[r]}">${g.join(' ')}</span>`);
  }else{
    h+='<h2>Tree so far</h2>'+b.vis.map(i=>`<span class="chip" style="border-color:${PAL[0]}">${V[i]}</span>`).join('');
    h+='<h2>Edges leaving the tree</h2><ul>';
    const L=s.cand;
    if(!L.length)h+='<li class="pend"><span>none left</span><span></span></li>';
    L.forEach((i,n)=>h+=`<li class="${i===s.cur?(x?'cur':'acc'):'cand'}"><span>${nm(i)}${n===0?' (cheapest)':''}</span><span>${E[i][2]}</span></li>`);
    h+='</ul>';
  }
  $('side').innerHTML=h;
}
function travel(i,dur){
  const[u,v]=E[i],d=$('dot'),t0=performance.now(),my=tk;d.style.opacity=1;
  (function f(t){const q=Math.min((t-t0)/dur,1);d.setAttribute('cx',P[u][0]+(P[v][0]-P[u][0])*q);d.setAttribute('cy',P[u][1]+(P[v][1]-P[u][1])*q);
    if(q<1&&my===tk)requestAnimationFrame(f);else d.style.opacity=0})(t0);
}
const dur=()=>[3200,2400,1800,1200,800][$('spd').value];
function pause(){playing=false;clearTimeout(tm);tk++;$('dot').style.opacity=0;$('play').innerHTML='&#9654;'}
function tick(){
  if(idx>=steps.length-1){pause();return}
  const d=dur();idx++;ph='x';tk++;apply();travel(steps[idx].cur,d*.5);
  tm=setTimeout(()=>{ph='d';apply();tm=setTimeout(()=>playing&&tick(),d*.5)},d*.5);
}
function toggle(){
  if(playing){pause();ph='d';apply();return}
  if(idx>=steps.length-1){idx=0;ph='d';apply()}
  playing=true;$('play').innerHTML='&#10074;&#10074;';tick();
}
function go(i){pause();ph='d';idx=Math.max(0,Math.min(i,steps.length-1));apply()}
function setMode(m){pause();mode=m;steps=m==='k'?kruskal():prim();idx=0;ph='d';
  $('bk').classList.toggle('on',m==='k');$('bp').classList.toggle('on',m==='p');
  E.forEach((e,i)=>$('e'+i).setAttribute('class','e'));apply()}
$('bk').onclick=()=>setMode('k');$('bp').onclick=()=>setMode('p');
$('play').onclick=toggle;$('next').onclick=()=>go(idx+1);$('back').onclick=()=>go(ph==='x'?idx-1:idx-1);
$('scr').oninput=e=>go(+e.target.value);
$('spd').onchange=()=>{if(playing){pause();toggle()}};
addEventListener('keydown',e=>{
  if(e.target.tagName==='SELECT'||e.target.id==='scr')return;
  if(e.code==='Space'){e.preventDefault();toggle()}
  if(e.key==='ArrowRight')go(idx+1);if(e.key==='ArrowLeft')go(idx-1);
});
apply();
</script>
</body>
</html>
